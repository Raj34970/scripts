apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-lb"
spec:
  type: "{{ .Values.service.type }}"
  selector:
    app: "{{ .Release.Name }}"
  ports:
    - name: http
      port: "{{ .Values.service.ports.http }}"
      targetPort: 80
    - name: https
      port: "{{ .Values.service.ports.https }}"
      targetPort: 443
