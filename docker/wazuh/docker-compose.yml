services:
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.4-rc1
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    restart: always
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "CLUSTER_NAME=wazuh"
      - "NODE_NAME=wazuh.indexer"
      - "DISCOVERY_TYPE=single-node"
      - "BASIC_AUTH_FIXED_PASSWORD_USER=admin:Rajarshi2024@%"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh_indexer_data:/var/lib/opensearch/data
    ports:
      - "9200:9200"

  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.4-rc1
    container_name: wazuh.manager
    hostname: wazuh.manager
    restart: always
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USER=admin
      - INDEXER_PASSWORD=Rajarshi2024@%
    volumes:
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.4-rc1
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "443:5601"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - WAZUH_MANAGER_URL=https://wazuh.manager:55000
      - INDEXER_USER=admin
      - INDEXER_PASSWORD=Rajarshi2024@%
    depends_on:
      - wazuh.indexer
      - wazuh.manager

volumes:
  wazuh_indexer_data:
  wazuh_etc:
  wazuh_logs: